[project]
name = "gbd"
version = "0.1.0"
description = "Agente workflow de Gestión Bancaria Documental (conciliación de cartas fianza) sobre Microsoft Foundry + Postgres/pgvector"
requires-python = ">=3.12"
dependencies = [
  "azure-ai-projects>=2.8",
  "azure-identity>=1.19",
  "openai>=1.60",
  "agent-framework-core>=1.22",
  "psycopg[binary]>=3.2",
  "pypdf>=5",
  "openpyxl>=3.1",
  "pyyaml>=6",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4", "ruff>=0.8"]

[project.scripts]
gbd = "gbd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requiere Postgres y Foundry (no corre en CI)"]

[tool.ruff]
line-length = 110
